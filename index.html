<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio privé - Eddy Lemahieu</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Calibri,Arial,sans-serif;
    background:#0f172a;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.login{

    width:420px;

    background:#1e293b;

    padding:40px;

    border-radius:20px;

    box-shadow:0 0 30px rgba(0,0,0,.35);

    text-align:center;

}

.logo{

    font-size:70px;

    margin-bottom:20px;

}

h1{

    margin-bottom:10px;

}

p{

    color:#cbd5e1;

    margin-bottom:30px;

}

input{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    margin-bottom:20px;

    font-size:16px;

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    background:#2563eb;

    color:white;

    font-size:18px;

    cursor:pointer;

}

button:hover{

    background:#1d4ed8;

}

#erreur{

    color:#ff6b6b;

    margin-top:20px;

    font-weight:bold;

}

</style>

</head>

<body>

<div class="login">

<div class="logo">🔒</div>

<h1>Portfolio privé</h1>

<p>Eddy Lemahieu</p>

<input
id="password"
type="password"
placeholder="Mot de passe">

<button onclick="connexion()">

Accéder

</button>

<div id="erreur"></div>

</div>

<script>

function connexion(){

let mdp=document.getElementById("password").value;

if(mdp=="portfolio2026"){

location.href="accueil.html";

}

else{

document.getElementById("erreur").innerHTML="Mot de passe incorrect.";

}

}

</script>

</body>

</html>
